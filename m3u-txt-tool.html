<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TXT ⇆ M3U 在线互转</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;margin:18px;background:#f7f8fb;color:#111}
  h1{font-size:20px;margin-bottom:12px}
  .panel{background:#fff;border:1px solid #e3e6ee;border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,30,50,0.04)}
  textarea{width:100%;height:200px;padding:10px;font-family:monospace;font-size:13px;border:1px solid #e6e9f2;border-radius:6px;resize:vertical}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  button{background:#0b5cff;color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
  button.secondary{background:#eef2ff;color:#0b5cff;border:1px solid #d7e0ff}
  pre.preview{white-space:pre-wrap;word-break:break-word;background:#0f1724;color:#e6eefc;padding:12px;border-radius:6px;overflow:auto;max-height:320px}
  .file-drop{border:2px dashed #dfe7ff;padding:18px;border-radius:8px;text-align:center;color:#335}
  #copyTip{color:green;font-size:13px;display:none;margin-left:10px}
</style>
</head>
<body>

<h1>TXT ⇆ M3U 在线互转</h1>

<div class="panel">
  <div class="file-drop" id="drop">拖放文件到此，或使用下方按钮上传 TXT / M3U</div>

  <textarea id="input" placeholder="在此粘贴或输入 TXT / M3U 内容..."></textarea>

  <div class="row">
    <input id="file" type="file" accept=".txt,.m3u" style="display:none"/>
    <button id="choose">选择文件</button>
    <button id="convert" class="secondary">检测并转换</button>
    <button id="clear" class="secondary">清空</button>
    <button id="download" style="margin-left:auto">下载输出文件</button>
  </div>

  <div style="height:10px"></div>
  <div class="small hint">注意：此工具在浏览器端运行，不会上传你的文件或内容到任何服务器（离线）。</div>
</div>

<div class="panel">
  <h3 style="display:flex;align-items:center;">
    转换结果：
    <button id="copyBtn" style="margin-left:15px;background:#10b981">复制结果</button>
    <span id="copyTip">已复制！</span>
  </h3>
  <pre id="output" class="preview"></pre>
</div>

<script>
/*---------------------------------------
  基础工具
----------------------------------------*/
function splitLines(text){
  return text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
}

// 自动检测输入格式
function detectFormat(text){
  text = text.trim();
  if (!text) return null;
  if (/#EXTINF/i.test(text) || /#EXTM3U/i.test(text)) return "m3u";
  return "txt";
}

/*---------------------------------------
  M3U → TXT（按组汇总，每组只出现一次）
----------------------------------------*/
function m3uToTxt(text){
  const lines = splitLines(text);
  const groupMap = new Map();

  let tempGroup = "";
  let tempName = "";

  for (let raw of lines) {
    const line = raw.trim();
    if (!line) continue;

    if (/^#EXTINF/i.test(line)) {
      const gMatch = line.match(/group-title="([^"]*)"/);
      tempGroup = gMatch ? gMatch[1].trim() : "未分组";
      tempName = line.split(",").pop().trim();

      if (!groupMap.has(tempGroup)) {
        groupMap.set(tempGroup, []);
      }
    }
    else if (!line.startsWith("#")) {
      if (tempName) {
        groupMap.get(tempGroup).push({
          name: tempName,
          url: line
        });
      }
      tempName = "";
    }
  }

  const out = [];
  for (let [group, items] of groupMap.entries()) {
    out.push(`${group},#genre#`);
    for (let item of items) {
      out.push(`${item.name},${item.url}`);
    }
  }

  return out.join("\n");
}

/*---------------------------------------
  TXT → M3U（支持多组）
----------------------------------------*/
function txtToM3u(text){
  const lines = splitLines(text);
  const out = ['#EXTM3U x-tvg-url="https://live.fanmingming.cn/e.xml"'];

  let currentGroup = "";

  for (let raw of lines) {
    const line = raw.trim();
    if (!line) continue;

    if (line.endsWith(",#genre#")) {
      currentGroup = line.replace(",#genre#", "").trim();
      continue;
    }

    const parts = line.split(",");
    if (parts.length >= 2) {
      const name = parts[0].trim();
      const url = parts.slice(1).join(",").trim();

      out.push(`#EXTINF:-1 tvg-id="${name}" tvg-name="${name}" tvg-logo="https://live.fanmingming.cn/tv/${name}.png" group-title="${currentGroup}",${name}`);
      out.push(url);
    }
  }

  return out.join("\n");
}

/*---------------------------------------
  UI 逻辑
----------------------------------------*/
const inputEl = document.getElementById("input");
const outputEl = document.getElementById("output");

// 按钮
document.getElementById("choose").onclick = () => document.getElementById("file").click();

document.getElementById("file").onchange = async (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  inputEl.value = await f.text();
  doConvert();
};

document.getElementById("convert").onclick = doConvert;
document.getElementById("clear").onclick = () => { inputEl.value = ""; outputEl.textContent = ""; };

/*---------------------------------------
  拖拽文件
----------------------------------------*/
const drop = document.getElementById("drop");

drop.addEventListener("dragover", e => { e.preventDefault(); drop.style.background="#eef7ff"; });
drop.addEventListener("dragleave", () => drop.style.background="");
drop.addEventListener("drop", async e => {
  e.preventDefault(); drop.style.background="";
  const f = e.dataTransfer.files[0];
  if (!f) return;
  inputEl.value = await f.text();
  doConvert();
});

/*---------------------------------------
  执行转换
----------------------------------------*/
function doConvert(){
  const text = inputEl.value.trim();
  if (!text){
    outputEl.textContent = "";
    return;
  }

  const fmt = detectFormat(text);
  outputEl.textContent = fmt === "m3u" ? m3uToTxt(text) : txtToM3u(text);
}

/*---------------------------------------
  下载
----------------------------------------*/
document.getElementById("download").onclick = () => {
  const content = outputEl.textContent;
  if (!content) {
    alert("没有可下载内容！");
    return;
  }

  const fmt = detectFormat(inputEl.value.trim());
  const ext = fmt === "m3u" ? ".txt" : ".m3u";

  const blob = new Blob([content], {type: "text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "playlist" + ext;
  a.click();
  URL.revokeObjectURL(url);
};

/*---------------------------------------
  ★ 新增：复制转换结果
----------------------------------------*/
document.getElementById("copyBtn").onclick = async () => {
  const text = outputEl.textContent;
  if (!text){
    alert("没有可复制内容！");
    return;
  }

  await navigator.clipboard.writeText(text);

  const tip = document.getElementById("copyTip");
  tip.style.display = "inline";
  setTimeout(()=> tip.style.display = "none", 1200);
};
</script>

</body>
</html>
